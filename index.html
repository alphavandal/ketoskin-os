<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Apple PWA Settings (Makes it a real app) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KetoSkin">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1099/1099672.png">
    
    <title>KetoSkin OS</title>
    <style>
        :root {
            --bg: #000000; --card: #1c1c1e; --primary: #0a84ff; --success: #32d74b; --warning: #ffd60a; --danger: #ff453a;
            --text-main: #ffffff; --text-muted: #8e8e93;
            --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; }
        body { margin: 0; background-color: var(--bg); color: var(--text-main); padding-top: var(--safe-top); padding-bottom: calc(90px + var(--safe-bottom)); }
        
        /* Header & Sync */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; }
        h1 { font-size: 28px; font-weight: 800; margin: 0; }
        .sync-dot { width: 10px; height: 10px; border-radius: 50%; background-color: var(--text-muted); }
        .sync-dot.online { background-color: var(--success); box-shadow: 0 0 8px var(--success); }
        .sync-dot.syncing { background-color: var(--warning); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        h2 { font-size: 20px; font-weight: 700; margin: 0 0 15px 0; }
        .section { padding: 0 20px; margin-bottom: 25px; }
        .card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 15px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        
        .btn { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; width: 100%; margin-top:10px; cursor: pointer; }
        .btn-small { padding: 8px 12px; font-size: 13px; border-radius: 8px; background: #3a3a3c; border: none; color: white; font-weight: bold; }
        
        .macro-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; text-align: center; margin-top: 15px; }
        .macro-val { font-size: 20px; font-weight: 800; }
        
        .tab-bar { position: fixed; bottom: 0; width: 100%; background: rgba(28, 28, 30, 0.9); backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 15px 0 calc(10px + var(--safe-bottom)); border-top: 1px solid #38383a; }
        .tab-item { color: var(--text-muted); font-size: 12px; font-weight: 600; text-align: center; }
        .tab-item.active { color: var(--primary); }
        .view { display: none; } .view.active { display: block; }
    </style>
</head>
<body>

    <div class="header">
        <h1>KetoSkin-Fit</h1>
        <div style="display:flex; align-items:center; gap:6px;">
            <span id="sync-text" style="font-size:10px; color:var(--text-muted); font-weight:bold; text-transform:uppercase;">Offline</span>
            <div id="sync-indicator" class="sync-dot"></div>
        </div>
    </div>

    <!-- 1. HUB VIEW -->
    <div id="view-hub" class="view active section">
        
        <!-- Apple Watch Health Card -->
        <div class="card">
            <div class="flex-between">
                <h2>Gym Watch Sync</h2>
                <span id="hr-display" style="font-size: 24px; font-weight: 800; color:var(--danger)">-- BPM</span>
            </div>
            <p style="font-size: 12px; color: var(--text-muted);">Syncs automatically via iOS Shortcuts</p>
        </div>

        <div class="card">
            <h2>FatSecret Macros</h2>
            <div class="macro-grid">
                <div><span id="mac-cals" class="macro-val">0</span><br><span style="font-size:10px; color:var(--text-muted)">CALS</span></div>
                <div><span id="mac-fat" class="macro-val" style="color:var(--warning)">0g</span><br><span style="font-size:10px; color:var(--text-muted)">FAT</span></div>
                <div><span id="mac-carb" class="macro-val" style="color:var(--primary)">0g</span><br><span style="font-size:10px; color:var(--text-muted)">CARBS</span></div>
            </div>
            <button class="btn-small" style="width:100%; margin-top:15px;" onclick="inputMacros()">Manual Log Macros</button>
        </div>

        <div class="card" id="workout-card">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- 2. INVENTORY VIEW -->
    <div id="view-stock" class="view section">
        <div class="flex-between" style="margin-bottom: 10px;">
            <h2>Supplies Tracker</h2>
            <button class="btn-small" onclick="logDailyStock()">Deduct Daily Use</button>
        </div>
        <div id="inventory-list"></div>
    </div>

    <nav class="tab-bar">
        <div class="tab-item active" onclick="switchTab('hub', this)">🏋️‍♂️<br>Hub</div>
        <div class="tab-item" onclick="switchTab('stock', this)">🛒<br>Stock</div>
    </nav>

    <script>
        // ==========================================
        // 🛑 ENTER YOUR SUPABASE DETAILS HERE 🛑
        // ==========================================
        const SUPABASE_URL = 'https://ifyzlxwbymehemdadnmj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_osWPpN1XxsPX8MFyT_y7Tg_3YXVwJok';
        // ==========================================

        let cloudHR = "--";

        // --- LOCAL-FIRST DATABASE ---
        let db = JSON.parse(localStorage.getItem('ketoskin_db')) || {
            macros: { cals: 0, fat: 0, carb: 0 },
            inventory: [
                { id: 1, name: "Zinplex Pills", qty: 60, rate: 1 },
                { id: 2, name: "Face Wash", qty: 150, rate: 5 },
                { id: 3, name: "Eggs", qty: 30, rate: 2 },
                { id: 4, name: "Chicken", qty: 1.5, rate: 0.2 }
            ]
        };

        // --- CLOUD SYNC ENGINE ---
        async function syncToCloud() {
            if (!navigator.onLine || SUPABASE_URL === 'YOUR_SUPABASE_URL') return;
            const dot = document.getElementById('sync-indicator');
            const text = document.getElementById('sync-text');
            dot.className = 'sync-dot syncing'; text.innerText = 'SYNCING';

            try {
                await fetch(`${SUPABASE_URL}/rest/v1/keto_state?id=eq.1`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ data: db })
                });
                dot.className = 'sync-dot online'; text.innerText = 'CLOUD OK';
            } catch (err) {
                dot.className = 'sync-dot'; text.innerText = 'SYNC FAILED';
            }
        }

        async function pullFromCloud() {
            if (!navigator.onLine || SUPABASE_URL === 'YOUR_SUPABASE_URL') return;
            try {
                let res = await fetch(`${SUPABASE_URL}/rest/v1/keto_state?id=eq.1&select=data,health_data`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                let json = await res.json();
                if (json && json[0]) {
                    if (json[0].data && Object.keys(json[0].data).length > 0) {
                        db = json[0].data;
                        localStorage.setItem('ketoskin_db', JSON.stringify(db));
                    }
                    if (json[0].health_data && json[0].health_data.hr) {
                        cloudHR = json[0].health_data.hr;
                    }
                    renderUI();
                }
            } catch(e) {}
        }

        // --- APP LOGIC ---
        function saveData() { 
            localStorage.setItem('ketoskin_db', JSON.stringify(db)); 
            renderUI(); 
            syncToCloud(); 
        }

        function renderUI() {
            // Render Macros & HR
            document.getElementById('mac-cals').innerText = db.macros.cals;
            document.getElementById('mac-fat').innerText = db.macros.fat + "g";
            document.getElementById('mac-carb').innerText = db.macros.carb + "g";
            document.getElementById('hr-display').innerText = cloudHR + " BPM";

            // Render Workouts
            const splits = ["Rest", "Posterior (Deadlifts, Face Pulls)", "Push (Chest, Shoulders, Abs)", "Quads & Lats", "Glutes & Posture", "Full Body Meta-Burn", "Active Recovery"];
            document.getElementById('workout-card').innerHTML = `
                <h3 style="margin-top:0; color:var(--primary)">Today's Training</h3>
                <p style="font-size:16px; font-weight:bold;">${splits[new Date().getDay()]}</p>
                <p style="font-size:12px; color:var(--text-muted); margin-top: 10px;">Target Zone 2 Cardio Burn afterwards.</p>
            `;

            // Render Inventory
            document.getElementById('inventory-list').innerHTML = db.inventory.map(i => {
                let days = Math.floor(i.qty / i.rate);
                return `<div class="card flex-between" style="padding:15px; border-left: ${days <= 3 ? '4px solid var(--warning)' : 'none'}">
                    <div><b>${i.name}</b><br><span style="font-size:12px; color:var(--text-muted)">${days} days left</span></div>
                    <div style="font-size:18px; font-weight:bold;">${parseFloat(i.qty).toFixed(1)}</div>
                </div>`;
            }).join('');
        }

        function inputMacros() {
            const input = prompt("Enter FatSecret Data\nFormat: Calories, Fat, Carbs\nExample: 1800, 120, 20");
            if(input) {
                const d = input.split(",");
                if(d.length === 3) {
                    db.macros = { cals: d[0].trim(), fat: d[1].trim(), carb: d[2].trim() };
                    saveData();
                }
            }
        }

        function logDailyStock() {
            db.inventory = db.inventory.map(i => { i.qty = Math.max(0, i.qty - i.rate); return i; });
            saveData();
            alert("Inventory updated & backing up to cloud.");
        }

        function switchTab(viewId, element) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            element.classList.add('active');
        }

        // Initialize App
        renderUI();
        pullFromCloud(); // Pull latest data from cloud on startup
    </script>
</body>
</html>
